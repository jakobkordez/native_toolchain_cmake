name: add_link
description: A sample showing how to split building and linking across hooks with native_toolchain_cmake.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  code_assets: ^2.1.0
  hooks: ^2.0.0
  # CLinker, to link the static libraries in hook/link.dart.
  native_toolchain_c: ^0.19.5
  native_toolchain_cmake:
    path: ../..

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
